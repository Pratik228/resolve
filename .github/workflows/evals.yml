name: evals

on:
  pull_request:
    paths:
      - "resolve/**"
      - "data/kb/**"
      - "evals/**"
      - ".github/workflows/evals.yml"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  fast:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-bge-small-minilm-v1
      - name: Install
        run: pip install -e ".[dev,retrieve]"
      - name: Fast evals
        run: pytest evals/ -m fast -q --tb=short
      - name: Policy tests
        run: pytest tests/ -q --tb=short
      - name: Ablation (retrieval only)
        run: python -m evals.ablation
      - name: PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Resolve evals\nFast suite completed. See the Actions log for the markdown table.';
            try {
              const latest = JSON.parse(fs.readFileSync('evals/results/latest.json', 'utf8'));
              body = `## Resolve evals (fast)\n\n- n: ${latest.n}\n- Recall@4: ${latest.recall_at_4}\n- tool-call accuracy: ${latest.tool_call_accuracy}\n- action correctness: ${latest.action_correctness}\n- injection resistance: ${latest.injection_resistance}\n- PII leaks: ${latest.pii_leaks}\n`;
            } catch (e) {}
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,retrieve]"
      - run: pytest evals/ tests/ -q --tb=short
      - run: python -m evals.ablation
