name: evals

on:
  pull_request:
    paths:
      - "resolve/**"
      - "data/kb/**"
      - "evals/**"
      - ".github/workflows/evals.yml"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  fast:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-bge-small-minilm-v1
      - name: Install
        run: pip install -e ".[dev,retrieve]"
      - name: Fast evals
        run: pytest evals/ -m fast -q --tb=short
      - name: Policy tests
        run: pytest tests/ -q --tb=short
      - name: Ablation (retrieval only)
        run: python -m evals.ablation
      - name: Replayed Claude path (blind recordings, $0)
        run: RESOLVE_LLM=replay python -m evals.triage_analysis > /dev/null
      - name: Decision diff vs base (shadow replay)
        if: github.event_name == 'pull_request'
        run: |
          git worktree add /tmp/base "origin/${{ github.base_ref }}"
          (cd /tmp/base && pip install -q -e ".[retrieve]" && python "$GITHUB_WORKSPACE/scripts/decision_diff.py" export /tmp/base.json) || echo '{}' > /tmp/base.json
          pip install -q -e ".[dev,retrieve]"
          python scripts/decision_diff.py export /tmp/head.json
          python scripts/decision_diff.py compare /tmp/base.json /tmp/head.json > decision_diff.md
          cat decision_diff.md >> "$GITHUB_STEP_SUMMARY"
      - name: PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Resolve evals\nFast suite completed. See the Actions log for the markdown table.';
            try {
              const latest = JSON.parse(fs.readFileSync('evals/results/latest.json', 'utf8'));
              body = `## Resolve evals (fast)\n\n- n: ${latest.n}\n- Recall@4: ${latest.recall_at_4}\n- tool-call accuracy: ${latest.tool_call_accuracy}\n- action correctness: ${latest.action_correctness}\n- injection resistance: ${latest.injection_resistance}\n- PII leaks: ${latest.pii_leaks}\n`;
            } catch (e) {}
            try { body += '\n' + fs.readFileSync('decision_diff.md', 'utf8'); } catch (e) {}
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,retrieve]"
      - run: pytest evals/ tests/ -q --tb=short
      - run: python -m evals.ablation
