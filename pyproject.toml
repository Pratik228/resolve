[project]
name = "resolve"
version = "0.1.0"
description = "Eval-gated agentic Tier-2 support engine for Northwind Cloud"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pratik Mishra" }]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sse-starlette==2.2.1",
    "sqlalchemy==2.0.36",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",
    "numpy==2.2.1",
    "httpx==0.28.1",
    "orjson==3.10.12",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.6",
]
llm = [
    "anthropic==2.6.0",
    "langgraph==0.2.60",
    "langchain-core==0.3.29",
    "langfuse==2.57.0",
]
retrieve = [
    "fastembed==0.5.1",
    "qdrant-client==1.12.1",
]
eval = [
    "deepeval==2.3.0",
]
postgres = [
    "psycopg[binary]==3.2.3",
    "psycopg2-binary==2.9.10",
    "asyncpg==0.30.0",
]
redis = [
    "redis==5.2.1",
]

[project.scripts]
resolve = "resolve.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resolve"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "fast: subset of eval cases for CI",
    "slow: full 60-case suite",
    "eval: requires retrieval + graph",
]
pythonpath = ["."]
testpaths = ["evals", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
